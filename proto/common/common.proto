syntax = "proto3";

package smartcredit.common;

option go_package = "github.com/alfabank-hackathon-2026/smart-credit/proto/gen/go/common;commonpb";

import "google/protobuf/timestamp.proto";

enum PurposeTag {
  PURPOSE_TAG_UNSPECIFIED = 0;
  PURPOSE_TAG_WORKING_CAPITAL = 1;
  PURPOSE_TAG_EQUIPMENT = 2;
  PURPOSE_TAG_EXPANSION = 3;
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_BANK_STATEMENT = 1;
  DOCUMENT_TYPE_BUSINESS_PLAN = 2;
  DOCUMENT_TYPE_ACCOUNTING_REPORT = 3;
  DOCUMENT_TYPE_MANAGEMENT_REPORT = 4;
  DOCUMENT_TYPE_TAX_DECLARATION_USN = 5;
  DOCUMENT_TYPE_TAX_DECLARATION_3NDFL = 6;
  DOCUMENT_TYPE_INCOME_LEDGER = 7;
  DOCUMENT_TYPE_PATENT = 8;
  DOCUMENT_TYPE_RECEIVABLES_PAYABLES = 9;
}

// Денежные значения передаются целыми копейками. currency всегда RUB.
message Money {
  int64 amount_kopecks = 1;
  string currency = 2;
}

message CompanySnapshot {
  string inn = 1;
  string name = 2;
  string okved = 3;
  string registered_at = 4; // YYYY-MM-DD
  Money revenue_12m = 5;
  Money profit_12m = 6; // Может быть отрицательной.
  Money obligations = 7;
  optional int32 profile_schema_version = 8;
  LegalForm legal_form = 9;
  repeated TaxPeriod tax_periods = 10;
  DatePeriod financial_period = 11;
  FinancialBasis financial_basis = 12;
  string obligations_as_of = 13;
}

message DocumentMetadata {
  string document_id = 1; // UUID
  DocumentType document_type = 2;
  string file_name = 3;
  string sha256 = 4;
  google.protobuf.Timestamp uploaded_at = 5;
  bool is_mock = 6;
  string requirement_id = 7;
  DatePeriod coverage_period = 8;
}

message ApplicationForm {
  Money amount = 1;
  int32 term_months = 2;
  PurposeTag purpose = 3;
}

message Offer {
  string offer_id = 1; // UUID
  OfferKind kind = 2;
  Money amount = 3;
  int32 term_months = 4;
  int32 rate_bps = 5;
  google.protobuf.Timestamp expires_at = 6;
  string explanation = 7;
  string product_id = 8; // Может отличаться от продукта исходной заявки.
  int64 product_version = 9;
  string product_name = 10; // Снимок названия на момент предложения.
}

enum OfferKind {
  OFFER_KIND_UNSPECIFIED = 0;
  OFFER_KIND_OFFER = 1;
  OFFER_KIND_COUNTER_OFFER = 2;
}

message InfoRequest {
  string request_id = 1; // UUID
  string message = 2;
  repeated InfoField required_fields = 3;
  repeated DocumentType required_document_types = 4;
  google.protobuf.Timestamp created_at = 5;
  repeated Requirement requirements = 6;
}

enum InfoField {
  INFO_FIELD_UNSPECIFIED = 0;
  INFO_FIELD_COMPANY_REVENUE_12M = 1;
  INFO_FIELD_COMPANY_PROFIT_12M = 2;
  INFO_FIELD_COMPANY_OBLIGATIONS = 3;
  INFO_FIELD_APPLICATION_AMOUNT = 4;
  INFO_FIELD_APPLICATION_TERM_MONTHS = 5;
  INFO_FIELD_APPLICATION_PURPOSE = 6;
}

message Product {
  string product_id = 1; // UUID
  string code = 2;
  string name = 3;
  string description = 4;
  repeated PurposeTag purpose_tags = 5;
  Money min_amount = 6;
  Money max_amount = 7;
  int32 min_term_months = 8;
  int32 max_term_months = 9;
  int32 indicative_rate_bps = 10;
  repeated DocumentType required_document_types = 11;
  int64 version = 12;
  string requirements_policy_version = 13;
}

enum LegalForm {
  LEGAL_FORM_UNSPECIFIED = 0;
  LEGAL_FORM_IP = 1;
  LEGAL_FORM_LLC = 2;
}

enum TaxRegime {
  TAX_REGIME_UNSPECIFIED = 0;
  TAX_REGIME_OSNO = 1;
  TAX_REGIME_USN_INCOME = 2;
  TAX_REGIME_USN_INCOME_EXPENSE = 3;
  TAX_REGIME_PSN = 4;
  TAX_REGIME_AUSN_INCOME = 5;
  TAX_REGIME_AUSN_INCOME_EXPENSE = 6;
  TAX_REGIME_ESHN = 7;
  TAX_REGIME_NPD = 8;
  TAX_REGIME_OTHER = 9;
  TAX_REGIME_UNKNOWN = 10;
}

enum VatStatus {
  VAT_STATUS_UNSPECIFIED = 0;
  VAT_STATUS_UNKNOWN = 1;
  VAT_STATUS_EXEMPT = 2;
  VAT_STATUS_PAYER = 3;
}

enum FinancialBasis {
  FINANCIAL_BASIS_UNSPECIFIED = 0;
  FINANCIAL_BASIS_MANAGEMENT = 1;
  FINANCIAL_BASIS_ACCOUNTING = 2;
  FINANCIAL_BASIS_TAX = 3;
  FINANCIAL_BASIS_UNKNOWN = 4;
}

enum RequirementKind {
  REQUIREMENT_KIND_UNSPECIFIED = 0;
  REQUIREMENT_KIND_FIELD = 1;
  REQUIREMENT_KIND_DOCUMENT = 2;
}

enum RequirementStage {
  REQUIREMENT_STAGE_UNSPECIFIED = 0;
  REQUIREMENT_STAGE_SUBMIT = 1;
  REQUIREMENT_STAGE_ASSESSMENT = 2;
  REQUIREMENT_STAGE_ON_REQUEST = 3;
}

enum RequirementStatus {
  REQUIREMENT_STATUS_UNSPECIFIED = 0;
  REQUIREMENT_STATUS_MISSING = 1;
  REQUIREMENT_STATUS_PROVIDED = 2;
}

enum RequirementsRoute {
  REQUIREMENTS_ROUTE_UNSPECIFIED = 0;
  REQUIREMENTS_ROUTE_STANDARD = 1;
  REQUIREMENTS_ROUTE_MANUAL_REVIEW = 2;
}

message DatePeriod { string from = 1; string to = 2; }
message TaxPeriod {
  string from = 1;
  optional string to = 2; // inclusive; absent means still active
  repeated TaxRegime regimes = 3;
  VatStatus vat_status = 4;
}
message Requirement {
  string id = 1;
  string code = 2;
  string label = 3;
  string reason = 4;
  RequirementKind kind = 5;
  RequirementStage required_at = 6;
  RequirementStatus status = 7;
  string field_path = 8;
  repeated DocumentType accepted_document_types = 9;
  DatePeriod period = 10;
  TaxRegime tax_regime = 11;
  repeated string document_ids = 12;
}
message RequirementsPlan {
  string policy_version = 1;
  string reference_date = 2;
  bool can_submit = 3;
  RequirementsRoute route = 4;
  repeated string reason_codes = 5;
  repeated Requirement items = 6;
}
