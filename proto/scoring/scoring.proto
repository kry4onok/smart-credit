syntax = "proto3";

package smartcredit.scoring;

option go_package = "github.com/alfabank-hackathon-2026/smart-credit/proto/gen/go/scoring;scoringpb";

import "proto/common/common.proto";

service ScoringService {
  // Borrower risk index, not a credit decision. Called by bank-service.
  rpc Score(ScoreRequest) returns (ScoreResponse);
}

message ScoreRequest {
  string application_id = 1; // UUID
  string product_id = 2; // UUID
  string feature_schema_version = 3; // Exactly borrower-features-v1.
  Features features = 4;
}

message Features {
  // Money: integer kopecks, RUB, absolute amount <= 9007199254740991.
  // Financials and overdue metrics cover the same trailing 12-calendar-month window.
  // Missing messages/scalars mean unknown; explicit zero means known zero.
  smartcredit.common.Money revenue_12m = 1; // Nonnegative; zero is unsupported.
  smartcredit.common.Money profit_12m = 2; // May be negative.
  smartcredit.common.Money obligations = 3; // Legacy, unused by borrower-features-v1.
  smartcredit.common.Money total_debt = 4; // Nonnegative outstanding balance as of assessment.
  optional int32 company_age_months = 5; // Full calendar months, nonnegative.
  string okved_group = 6; // Legacy, unused by borrower-features-v1.
  optional int32 overdue_count_12m = 7; // Distinct overdue episodes within the window.
  optional int32 max_overdue_days = 8; // Maximum DPD reached in that window; may exceed 365.
  // Application terms below are retained for compatibility, unused by v1.
  smartcredit.common.Money requested_amount = 9;
  int32 requested_term_months = 10;
  smartcredit.common.PurposeTag purpose_tag = 11;
}

message ScoreResponse {
  optional int32 score = 1; // 0..1000, higher means lower risk. Present iff ASSESSED.
  Grade grade = 2;
  repeated Reason reasons = 3;
  string model_version = 4;
  string feature_schema_version = 5;
  AssessmentStatus assessment_status = 6;
  repeated DataIssue data_issues = 7;
  repeated FactorContribution factor_contributions = 8;
  int32 baseline_score = 9; // score = baseline + sum(all signed factor points).
  string config_checksum = 10; // Lowercase SHA-256 of the exact model config bytes.
}

enum AssessmentStatus {
  ASSESSMENT_STATUS_UNSPECIFIED = 0; // Never a valid v1 service result.
  ASSESSMENT_STATUS_ASSESSED = 1;
  ASSESSMENT_STATUS_INSUFFICIENT_DATA = 2;
  ASSESSMENT_STATUS_UNSUPPORTED_INPUT = 3;
}

message DataIssue {
  string code = 1; // MISSING_VALUE, ZERO_REVENUE, INCONSISTENT_OVERDUE.
  string field_path = 2; // Proto field path, e.g. features.total_debt.
}

message FactorContribution {
  string factor_name = 1;
  int32 points = 2; // Signed score points; all four factors, including zero.
  string description = 3; // Internal bank explanation.
}

enum Grade {
  GRADE_UNSPECIFIED = 0;
  GRADE_A = 1;
  GRADE_B = 2;
  GRADE_C = 3;
  GRADE_D = 4;
  GRADE_E = 5;
}

message Reason {
  ReasonCode code = 1;
  string description = 2; // Internal bank explanation only.
  Direction direction = 3;
  int32 contribution = 4; // Absolute nonzero score points; direction carries the sign.
}

enum ReasonCode {
  REASON_CODE_UNSPECIFIED = 0;
  REASON_CODE_SHORT_HISTORY = 1;
  REASON_CODE_LOW_PROFIT_MARGIN = 2;
  REASON_CODE_HIGH_OBLIGATIONS = 3;
  REASON_CODE_HIGH_BUREAU_DEBT = 4;
  REASON_CODE_RECENT_OVERDUE = 5;
  REASON_CODE_LARGE_REQUEST = 6;
  REASON_CODE_STABLE_BUSINESS = 7;
  REASON_CODE_NO_OVERDUE = 8;
  REASON_CODE_HEALTHY_PROFIT_MARGIN = 9;
  REASON_CODE_MANAGEABLE_BUREAU_DEBT = 10;
  REASON_CODE_GOOD_PAYMENT_DISCIPLINE = 11;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_INCREASES_RISK = 1;
  DIRECTION_DECREASES_RISK = 2;
}
