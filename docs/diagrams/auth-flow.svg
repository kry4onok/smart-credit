<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1740" width="1480" height="1740" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Smart Credit — Вход и сессия</title><desc id="diagram-description">Один механизм для клиента, аналитика и администратора.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172234" flood-opacity="0.07"></feDropShadow></filter><marker id="arrow-gray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#506174"></path></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2055A2"></path></marker><marker id="arrow-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#18704D"></path></marker><marker id="arrow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#D92F26"></path></marker><marker id="arrow-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#9B5900"></path></marker></defs><rect width="1480" height="1740" fill="#F5F7FA"></rect><rect x="46" y="43" width="7" height="76" rx="3" fill="#D92F26" stroke="none" stroke-width="0"></rect><text x="74" y="64" fill="#D92F26" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" text-anchor="start">СЦЕНАРИЙ СЕРВИСА</text><text x="74" y="104" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="800" text-anchor="start">Вход и сессия</text><text x="74" y="136" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Один механизм для клиента, аналитика и администратора.</text><rect x="1194" y="53" width="240" height="34" rx="17" fill="#FFFFFF" stroke="none" stroke-width="0"></rect><text x="1314" y="74.42" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SMART CREDIT  /  MVP</text><line x1="390.5" y1="384" x2="390.5" y2="489" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="390.5" y1="694" x2="390.5" y2="799" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="390.5" y1="1004" x2="390.5" y2="1109" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="390.5" y1="1314" x2="390.5" y2="1419" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><rect x="58" y="194" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="194" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="214" width="134" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="147" y="232.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">01 · ЛОГИН</text><text x="80" y="276" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">POST /auth/login</text><text x="80" y="308" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Email и пароль демонстрационной учётки.</text><text x="80" y="332" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">auth сверяет хеш пароля в auth_db.</text><rect x="58" y="504" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="504" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="524" width="134" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="147" y="542.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">02 · ДОСТУП</text><text x="80" y="586" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">access JWT + refresh-cookie</text><text x="80" y="618" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">RS256 JWT передаётся как Bearer.</text><text x="80" y="642" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">HttpOnly cookie хранит refresh-сессию.</text><rect x="58" y="814" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="814" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="834" width="195" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="177.5" y="852.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">03 · ЗАЩИЩЁННЫЕ API</text><text x="80" y="896" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">GET /auth/me</text><text x="80" y="928" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">client-service и bank-service читают JWKS auth.</text><text x="80" y="952" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Роль JWT ограничивает доступ к своим API.</text><rect x="58" y="1124" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="1124" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="1144" width="150" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="155" y="1162.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">04 · ПРОДЛЕНИЕ</text><text x="80" y="1206" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">POST /auth/refresh</text><text x="80" y="1238" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">По действующей cookie выдаётся новый access JWT.</text><text x="80" y="1262" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Срок самой cookie не продлевается.</text><rect x="58" y="1434" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="1434" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="1454" width="134" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="147" y="1472.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">05 · ВЫХОД</text><text x="80" y="1516" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">POST /auth/logout</text><text x="80" y="1548" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Refresh-сессия отзывается; cookie очищается.</text><text x="80" y="1572" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Выданный access живёт до своего exp.</text><rect x="825" y="194" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="212" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="231" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Неверные данные</text><text x="859" y="259" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Неизвестный пользователь или неверный пароль → 401.</text><path d="M 731 289 H 770 V 242 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="814" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="832" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="851" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Неверный доступ</text><text x="859" y="879" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Нет Bearer JWT / не та роль → 401 / 403.</text><path d="M 731 909 H 770 V 862 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1124" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1142" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1161" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Refresh недействителен</text><text x="859" y="1189" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Новый access не выдаётся; нужен вход.</text><path d="M 731 1219 H 770 V 1172 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path></svg>
