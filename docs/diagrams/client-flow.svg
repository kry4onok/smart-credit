<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 2120" width="1480" height="2120" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Smart Credit — Путь клиента</title><desc id="diagram-description">Публичные статусы и действия от черновика до демо-выдачи.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172234" flood-opacity="0.07"></feDropShadow></filter><marker id="arrow-gray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#506174"></path></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2055A2"></path></marker><marker id="arrow-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#18704D"></path></marker><marker id="arrow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#D92F26"></path></marker><marker id="arrow-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#9B5900"></path></marker></defs><rect width="1480" height="2120" fill="#F5F7FA"></rect><rect x="46" y="43" width="7" height="76" rx="3" fill="#D92F26" stroke="none" stroke-width="0"></rect><text x="74" y="64" fill="#D92F26" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" text-anchor="start">СЦЕНАРИЙ СЕРВИСА</text><text x="74" y="104" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="800" text-anchor="start">Путь клиента</text><text x="74" y="136" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Публичные статусы и действия от черновика до демо-выдачи.</text><rect x="1194" y="53" width="240" height="34" rx="17" fill="#FFFFFF" stroke="none" stroke-width="0"></rect><text x="1314" y="74.42" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SMART CREDIT  /  MVP</text><line x1="390.5" y1="384" x2="390.5" y2="489" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="390.5" y1="694" x2="390.5" y2="799" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="390.5" y1="1004" x2="390.5" y2="1109" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="390.5" y1="1314" x2="390.5" y2="1419" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="390.5" y1="1624" x2="390.5" y2="1729" stroke="#2055A2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><rect x="58" y="194" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="194" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="214" width="134" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="147" y="232.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">01 · КЛИЕНТ</text><text x="80" y="276" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">DRAFT</text><text x="80" y="308" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Профиль компании, продукт, форма и документы.</text><text x="80" y="332" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">/submit → ApplicationSubmitted в client.events.</text><rect x="58" y="504" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="504" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="524" width="195" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="177.5" y="542.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">02 · ОЖИДАНИЕ БАНКА</text><text x="80" y="586" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">SUBMITTED</text><text x="80" y="618" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Заявка отправлена; банк создаёт дело.</text><text x="80" y="642" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Ответ на submit ещё не является решением.</text><rect x="58" y="814" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="814" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="834" width="141" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="150.5" y="852.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">03 · ПРОВЕРКА</text><text x="80" y="896" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">UNDER_REVIEW</text><text x="80" y="928" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">VALIDATION → ENRICHMENT → SCORING → DECISION.</text><text x="80" y="952" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Публичное состояние приходит через bank.events.</text><rect x="58" y="1124" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="1124" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="1144" width="168" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="164" y="1162.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">04 · ПРЕДЛОЖЕНИЕ</text><text x="80" y="1206" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">OFFER_AVAILABLE</text><text x="80" y="1238" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Получить условия и срок оферты.</text><text x="80" y="1262" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">/offer/accept → ACCEPT_PENDING.</text><rect x="58" y="1434" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="1434" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="1454" width="159" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="159.5" y="1472.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">05 · ОФОРМЛЕНИЕ</text><text x="80" y="1516" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">FORMALIZING</text><text x="80" y="1548" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Банк подтвердил OfferAccepted.</text><text x="80" y="1572" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">/sign → SIGN_PENDING → ContractSigned.</text><rect x="58" y="1744" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="1744" width="7" height="190" rx="3" fill="#2055A2" stroke="none" stroke-width="0"></rect><rect x="80" y="1764" width="134" height="29" rx="14.5" fill="#EAF2FF" stroke="none" stroke-width="0"></rect><text x="147" y="1782.58" fill="#2055A2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">06 · ИТОГ</text><text x="80" y="1826" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">DISBURSED</text><text x="80" y="1858" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Банк обработал подпись и опубликовал итог.</text><text x="80" y="1882" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Денежный перевод не выполняется.</text><rect x="825" y="194" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="212" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="231" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Ошибки заполнения</text><text x="859" y="259" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">422 INVALID_APPLICATION → остаётся DRAFT.</text><path d="M 731 289 H 770 V 242 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="814" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="832" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="851" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Банк просит данные</text><text x="859" y="879" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">NEEDS_INFO → /info → InfoProvided → новая проверка.</text><path d="M 731 909 H 770 V 862 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="928" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="946" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="965" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Банк отказывает</text><text x="859" y="993" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">REJECTED → публичная причина в карточке.</text><path d="M 731 909 H 770 V 976 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1042" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1060" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1079" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Ручной разбор</text><text x="859" y="1107" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Для клиента остаётся UNDER_REVIEW; решает аналитик.</text><path d="M 731 909 H 770 V 1090 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1156" width="600" height="120" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1174" width="5" height="84" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1193" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Оценка SME_CASHFLOW_V2</text><text x="859" y="1221" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Варианты CALCULATED не являются офертой.</text><text x="859" y="1244" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Условия подтверждает аналитик банка.</text><path d="M 731 909 H 770 V 1216 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1294" width="600" height="120" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1312" width="5" height="84" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1331" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Отказ или срок</text><text x="859" y="1359" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">/offer/decline → DECLINE_PENDING → CLOSED.</text><text x="859" y="1382" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Истечение оферты у банка → CLOSED.</text><path d="M 731 1219 H 770 V 1354 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1434" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1452" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1471" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Отзыв до подписи</text><text x="859" y="1499" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">/cancel → CANCEL_PENDING → CLOSED.</text><path d="M 731 1529 H 770 V 1482 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path></svg>
