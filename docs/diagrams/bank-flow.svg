<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 2640" width="1480" height="2640" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Smart Credit — Путь банковского дела и аналитика</title><desc id="diagram-description">Внутренние статусы, автоматические правила и действия сотрудника.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172234" flood-opacity="0.07"></feDropShadow></filter><marker id="arrow-gray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#506174"></path></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2055A2"></path></marker><marker id="arrow-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#18704D"></path></marker><marker id="arrow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#D92F26"></path></marker><marker id="arrow-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#9B5900"></path></marker></defs><rect width="1480" height="2640" fill="#F5F7FA"></rect><rect x="46" y="43" width="7" height="76" rx="3" fill="#D92F26" stroke="none" stroke-width="0"></rect><text x="74" y="64" fill="#D92F26" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" text-anchor="start">СЦЕНАРИЙ СЕРВИСА</text><text x="74" y="104" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="800" text-anchor="start">Путь банковского дела и аналитика</text><text x="74" y="136" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Внутренние статусы, автоматические правила и действия сотрудника.</text><rect x="1194" y="53" width="240" height="34" rx="17" fill="#FFFFFF" stroke="none" stroke-width="0"></rect><text x="1314" y="74.42" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SMART CREDIT  /  MVP</text><line x1="390.5" y1="384" x2="390.5" y2="489" stroke="#18704D" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"></line><line x1="390.5" y1="694" x2="390.5" y2="799" stroke="#18704D" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"></line><line x1="390.5" y1="1004" x2="390.5" y2="1109" stroke="#18704D" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"></line><line x1="390.5" y1="1314" x2="390.5" y2="1419" stroke="#18704D" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"></line><line x1="390.5" y1="1624" x2="390.5" y2="1729" stroke="#18704D" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"></line><line x1="390.5" y1="1934" x2="390.5" y2="2039" stroke="#18704D" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"></line><line x1="390.5" y1="2244" x2="390.5" y2="2349" stroke="#18704D" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"></line><rect x="58" y="194" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="194" width="7" height="190" rx="3" fill="#18704D" stroke="none" stroke-width="0"></rect><rect x="80" y="214" width="134" height="29" rx="14.5" fill="#E7F5EF" stroke="none" stroke-width="0"></rect><text x="147" y="232.58" fill="#18704D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">01 · СОБЫТИЕ</text><text x="80" y="276" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">VALIDATION</text><text x="80" y="308" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">ApplicationSubmitted из client.events.</text><text x="80" y="332" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Банк создаёт дело и проверяет полноту.</text><rect x="58" y="504" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="504" width="7" height="190" rx="3" fill="#18704D" stroke="none" stroke-width="0"></rect><rect x="80" y="524" width="141" height="29" rx="14.5" fill="#E7F5EF" stroke="none" stroke-width="0"></rect><text x="150.5" y="542.58" fill="#18704D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">02 · ПРОВЕРКИ</text><text x="80" y="586" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">ENRICHMENT</text><text x="80" y="618" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">gRPC bureau-mocks: компания и кредитная история.</text><text x="80" y="642" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Результат сохраняется в bank_db.</text><rect x="58" y="814" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="814" width="7" height="190" rx="3" fill="#18704D" stroke="none" stroke-width="0"></rect><rect x="80" y="834" width="134" height="29" rx="14.5" fill="#E7F5EF" stroke="none" stroke-width="0"></rect><text x="147" y="852.58" fill="#18704D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">03 · ОЦЕНКА</text><text x="80" y="896" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">SCORING</text><text x="80" y="928" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">gRPC scoring: score, grade и причины.</text><text x="80" y="952" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Результат не является кредитным решением.</text><rect x="58" y="1124" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="1124" width="7" height="190" rx="3" fill="#18704D" stroke="none" stroke-width="0"></rect><rect x="80" y="1144" width="134" height="29" rx="14.5" fill="#E7F5EF" stroke="none" stroke-width="0"></rect><text x="147" y="1162.58" fill="#18704D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">04 · ПРАВИЛА</text><text x="80" y="1206" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">DECISION</text><text x="80" y="1238" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Worker применяет версию правил продукта.</text><text x="80" y="1262" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Это ожидание исхода, не одобрение.</text><rect x="58" y="1434" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="1434" width="7" height="190" rx="3" fill="#18704D" stroke="none" stroke-width="0"></rect><rect x="80" y="1454" width="134" height="29" rx="14.5" fill="#E7F5EF" stroke="none" stroke-width="0"></rect><text x="147" y="1472.58" fill="#18704D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">05 · УСЛОВИЯ</text><text x="80" y="1516" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">OFFER / COUNTER_OFFER</text><text x="80" y="1548" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Банк публикует оферту в bank.events.</text><text x="80" y="1572" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Клиент видит OFFER_AVAILABLE.</text><rect x="58" y="1744" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="1744" width="7" height="190" rx="3" fill="#18704D" stroke="none" stroke-width="0"></rect><rect x="80" y="1764" width="141" height="29" rx="14.5" fill="#E7F5EF" stroke="none" stroke-width="0"></rect><text x="150.5" y="1782.58" fill="#18704D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">06 · ПРИНЯТИЕ</text><text x="80" y="1826" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">OFFER_ACCEPTED</text><text x="80" y="1858" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">OfferAccepted из client.events; сверяется offer_id.</text><text x="80" y="1882" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Клиенту доступна демо-подпись.</text><rect x="58" y="2054" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="2054" width="7" height="190" rx="3" fill="#18704D" stroke="none" stroke-width="0"></rect><rect x="80" y="2074" width="134" height="29" rx="14.5" fill="#E7F5EF" stroke="none" stroke-width="0"></rect><text x="147" y="2092.58" fill="#18704D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">07 · ПОДПИСЬ</text><text x="80" y="2136" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">SIGNING</text><text x="80" y="2168" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">ContractSigned из client.events.</text><text x="80" y="2192" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Worker выполняет демо-выдачу.</text><rect x="58" y="2364" width="665" height="190" rx="18" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="1.4" filter="url(#shadow)"></rect><rect x="58" y="2364" width="7" height="190" rx="3" fill="#18704D" stroke="none" stroke-width="0"></rect><rect x="80" y="2384" width="134" height="29" rx="14.5" fill="#E7F5EF" stroke="none" stroke-width="0"></rect><text x="147" y="2402.58" fill="#18704D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">08 · ИТОГ</text><text x="80" y="2446" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">DISBURSED</text><text x="80" y="2478" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Банк публикует финальный снимок.</text><text x="80" y="2502" fill="#506174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Фактических денег система не переводит.</text><rect x="825" y="194" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="212" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="231" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Неизвестная версия продукта</text><text x="859" y="259" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">MANUAL_REVIEW: дело доступно аналитику.</text><path d="M 731 289 H 770 V 242 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="308" width="600" height="120" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="326" width="5" height="84" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="345" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Недостающие данные</text><text x="859" y="373" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">NEEDS_INFO → запрос клиенту.</text><text x="859" y="396" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">InfoProvided → обратно в VALIDATION.</text><path d="M 731 289 H 770 V 368 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1124" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1142" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1161" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Автоматические исходы</text><text x="859" y="1189" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">OFFER · NEEDS_INFO · MANUAL_REVIEW · REJECTED.</text><path d="M 731 1219 H 770 V 1172 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1238" width="600" height="168" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1256" width="5" height="132" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1275" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">MANUAL_REVIEW → решение аналитика</text><text x="859" y="1303" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">/bank: список → карточка → /take.</text><text x="859" y="1326" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">/decision с ETag и Idempotency-Key.</text><text x="859" y="1349" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">APPROVE / COUNTER → оферта; REQUEST_INFO → NEEDS_INFO;</text><text x="859" y="1372" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">REJECT → REJECTED.</text><path d="M 731 1219 H 770 V 1303 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1424" width="600" height="120" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1442" width="5" height="84" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1461" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Путь оценки v2</text><text x="859" y="1489" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">SME_CASHFLOW_V2: варианты CALCULATED.</text><text x="859" y="1512" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Аналитик подтверждает актуальный вариант.</text><path d="M 731 1219 H 770 V 1484 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1562" width="600" height="96" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1580" width="5" height="60" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1599" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Отказ банка</text><text x="859" y="1627" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">REJECTED → публичная причина для клиента.</text><path d="M 731 1219 H 770 V 1610 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path><rect x="825" y="1676" width="600" height="120" rx="14" fill="#FFF3DF" stroke="none" stroke-width="0"></rect><rect x="841" y="1694" width="5" height="84" rx="3" fill="#9B5900" stroke="none" stroke-width="0"></rect><text x="859" y="1713" fill="#9B5900" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="start">Оферта не принята</text><text x="859" y="1741" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">OfferDeclined или отзыв → CANCELLED.</text><text x="859" y="1764" fill="#172234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Срок expires_at → EXPIRED.</text><path d="M 731 1529 H 770 V 1736 H 810" fill="none" stroke="#9B5900" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"></path></svg>
