<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" width="1280" height="850" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Путь заявки Smart Credit</title><desc id="diagram-description">Шесть этапов от подачи заявки до демо-выдачи: отправка, проверка, оферта, принятие, подпись, симуляция выдачи.</desc><defs><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1E2026" flood-opacity="0.06"></feDropShadow></filter><marker id="arrow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#EF3124"></path></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2C58B5"></path></marker><marker id="arrow-gray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#AAB4C2"></path></marker></defs><rect width="1280" height="850" fill="#F7F8FA"></rect><rect x="40" y="43" width="7" height="72" rx="3" fill="#EF3124" stroke="none" stroke-width="0"></rect><text x="68" y="62" fill="#EF3124" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2.2" text-anchor="start">ПУТЬ КЛИЕНТА</text><text x="68" y="100" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="start">От заявки до демо-выдачи.</text><text x="68" y="130" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Шесть шагов; между клиентским и банковским контурами идут события Kafka.</text><rect x="1019" y="52" width="220" height="33" rx="16.5" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3"></rect><text x="1129" y="72.58" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SMART CREDIT  /  MVP</text><text x="42" y="174" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.7" text-anchor="start">01—03  /  ДО ОФЕРТЫ</text><rect x="40" y="190" width="370" height="232" rx="22" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><rect x="40" y="190" width="370" height="6" rx="3" fill="#2C58B5" stroke="none" stroke-width="0"></rect><rect x="65" y="213" width="125" height="30" rx="15" fill="#E8EEFA" stroke="none" stroke-width="0"></rect><text x="127.5" y="232.08" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">КЛИЕНТ</text><text x="377" y="242" fill="#CAD0D9" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" text-anchor="end">01</text><text x="65" y="285" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">Подача</text><text x="65" y="316" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Компания, сумма, срок, документы.</text><text x="65" y="340" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Отправка запускает рассмотрение.</text><line x1="65" y1="364" x2="385" y2="364" stroke="#DFE2E7" stroke-width="1" stroke-linecap="round"></line><text x="65" y="396" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start">client.events  ·  ApplicationSubmitted</text><rect x="455" y="190" width="370" height="232" rx="22" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><rect x="455" y="190" width="370" height="6" rx="3" fill="#A35700" stroke="none" stroke-width="0"></rect><rect x="480" y="213" width="125" height="30" rx="15" fill="#FFF1DC" stroke="none" stroke-width="0"></rect><text x="542.5" y="232.08" fill="#A35700" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">БАНК</text><text x="792" y="242" fill="#CAD0D9" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" text-anchor="end">02</text><text x="480" y="285" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">Проверка</text><text x="480" y="316" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Бюро и scoring дают данные.</text><text x="480" y="340" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">DECISION ждёт банковских правил.</text><line x1="480" y1="364" x2="800" y2="364" stroke="#DFE2E7" stroke-width="1" stroke-linecap="round"></line><text x="480" y="396" fill="#A35700" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start">VALIDATION  →  SCORING  →  DECISION</text><rect x="870" y="190" width="370" height="232" rx="22" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><rect x="870" y="190" width="370" height="6" rx="3" fill="#0F7451" stroke="none" stroke-width="0"></rect><rect x="895" y="213" width="125" height="30" rx="15" fill="#E4F3EC" stroke="none" stroke-width="0"></rect><text x="957.5" y="232.08" fill="#0F7451" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">БАНК → КЛИЕНТ</text><text x="1207" y="242" fill="#CAD0D9" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" text-anchor="end">03</text><text x="895" y="285" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">Оферта</text><text x="895" y="316" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Банк публикует условия.</text><text x="895" y="340" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Клиент видит активную оферту.</text><line x1="895" y1="364" x2="1215" y2="364" stroke="#DFE2E7" stroke-width="1" stroke-linecap="round"></line><text x="895" y="396" fill="#0F7451" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start">bank.events  →  OFFER_AVAILABLE</text><line x1="418" y1="304" x2="447" y2="304" stroke="#AAB4C2" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-gray)"></line><line x1="833" y1="304" x2="862" y2="304" stroke="#AAB4C2" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-gray)"></line><text x="42" y="478" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.7" text-anchor="start">04—06  /  ПОСЛЕ ОФЕРТЫ</text><rect x="40" y="494" width="370" height="232" rx="22" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><rect x="40" y="494" width="370" height="6" rx="3" fill="#2C58B5" stroke="none" stroke-width="0"></rect><rect x="65" y="517" width="125" height="30" rx="15" fill="#E8EEFA" stroke="none" stroke-width="0"></rect><text x="127.5" y="536.08" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">КЛИЕНТ</text><text x="377" y="546" fill="#CAD0D9" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" text-anchor="end">04</text><text x="65" y="589" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">Принятие</text><text x="65" y="620" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Клиент принимает оферту.</text><text x="65" y="644" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Банк сверяет её offer_id.</text><line x1="65" y1="668" x2="385" y2="668" stroke="#DFE2E7" stroke-width="1" stroke-linecap="round"></line><text x="65" y="700" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start">OfferAccepted  →  FORMALIZING</text><rect x="455" y="494" width="370" height="232" rx="22" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><rect x="455" y="494" width="370" height="6" rx="3" fill="#2C58B5" stroke="none" stroke-width="0"></rect><rect x="480" y="517" width="125" height="30" rx="15" fill="#E8EEFA" stroke="none" stroke-width="0"></rect><text x="542.5" y="536.08" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">КЛИЕНТ</text><text x="792" y="546" fill="#CAD0D9" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" text-anchor="end">05</text><text x="480" y="589" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">Демо-подпись</text><text x="480" y="620" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Клиент подтверждает документ.</text><text x="480" y="644" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Банк получает событие подписи.</text><line x1="480" y1="668" x2="800" y2="668" stroke="#DFE2E7" stroke-width="1" stroke-linecap="round"></line><text x="480" y="700" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start">client.events  ·  ContractSigned</text><rect x="870" y="494" width="370" height="232" rx="22" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><rect x="870" y="494" width="370" height="6" rx="3" fill="#0F7451" stroke="none" stroke-width="0"></rect><rect x="895" y="517" width="125" height="30" rx="15" fill="#E4F3EC" stroke="none" stroke-width="0"></rect><text x="957.5" y="536.08" fill="#0F7451" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">БАНК</text><text x="1207" y="546" fill="#CAD0D9" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" text-anchor="end">06</text><text x="895" y="589" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">Демо-выдача</text><text x="895" y="620" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Worker записывает результат.</text><text x="895" y="644" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Клиент видит итоговый статус.</text><line x1="895" y1="668" x2="1215" y2="668" stroke="#DFE2E7" stroke-width="1" stroke-linecap="round"></line><text x="895" y="700" fill="#0F7451" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start">bank.events  ·  DISBURSED</text><line x1="418" y1="608" x2="447" y2="608" stroke="#AAB4C2" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-gray)"></line><line x1="833" y1="608" x2="862" y2="608" stroke="#AAB4C2" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-gray)"></line><rect x="40" y="759" width="1200" height="53" rx="15" fill="#FDECEB" stroke="none" stroke-width="0"></rect><rect x="59" y="773" width="5" height="25" rx="2" fill="#EF3124" stroke="none" stroke-width="0"></rect><text x="80" y="792" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">DISBURSED — запись результата симуляции, а не денежный перевод.</text></svg>
