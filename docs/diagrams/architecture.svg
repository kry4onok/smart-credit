<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" width="1280" height="850" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Архитектура Smart Credit</title><desc id="diagram-description">Клиентский и банковский сервисы обмениваются событиями через Kafka; у каждого своя база.</desc><defs><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1E2026" flood-opacity="0.06"></feDropShadow></filter><marker id="arrow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#EF3124"></path></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2C58B5"></path></marker><marker id="arrow-gray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#AAB4C2"></path></marker></defs><rect width="1280" height="850" fill="#F7F8FA"></rect><rect x="40" y="43" width="7" height="72" rx="3" fill="#EF3124" stroke="none" stroke-width="0"></rect><text x="68" y="62" fill="#EF3124" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2.2" text-anchor="start">АРХИТЕКТУРА</text><text x="68" y="100" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="start">Два контура. Один поток событий.</text><text x="68" y="130" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Карта MVP: интерфейсы, сервисы, хранение и локальные проверки.</text><rect x="1019" y="52" width="220" height="33" rx="16.5" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3"></rect><text x="1129" y="72.58" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SMART CREDIT  /  MVP</text><rect x="40" y="160" width="1200" height="142" rx="22" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><text x="66" y="191" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.7" text-anchor="start">ТОЧКИ ВХОДА  ·  HTTP</text><rect x="66" y="215" width="116" height="50" rx="25" fill="#FDECEB" stroke="none" stroke-width="0"></rect><text x="124" y="245.44" fill="#EF3124" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Клиент</text><rect x="194" y="215" width="132" height="50" rx="25" fill="#FDECEB" stroke="none" stroke-width="0"></rect><text x="260" y="245.44" fill="#EF3124" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Аналитик</text><line x1="339" y1="240" x2="375" y2="240" stroke="#AAB4C2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-gray)"></line><rect x="391" y="209" width="215" height="62" rx="14" fill="#F7F8FA" stroke="#DFE2E7" stroke-width="1.3"></rect><text x="413" y="236" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">web</text><text x="413" y="257" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">кабинет · backoffice</text><rect x="622" y="209" width="240" height="62" rx="14" fill="#F7F8FA" stroke="#DFE2E7" stroke-width="1.3"></rect><text x="644" y="236" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">gateway + Swagger</text><text x="644" y="257" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">единый адрес /api и /docs</text><rect x="878" y="209" width="334" height="62" rx="14" fill="#F7F8FA" stroke="#DFE2E7" stroke-width="1.3"></rect><text x="900" y="236" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">auth</text><text x="900" y="257" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">JWT · роли</text><ellipse cx="1091" cy="233" rx="10" ry="4" fill="none" stroke="#61666F" stroke-width="1.4"></ellipse><path d="M1081,233 v12 c0,5 20,5 20,0 v-12" fill="none" stroke="#61666F" stroke-width="1.4"></path><text x="1112" y="245" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start">auth_db</text><text x="43" y="350" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.7" text-anchor="start">БИЗНЕС-ОБМЕН  ·  ТОЛЬКО KAFKA</text><rect x="40" y="374" width="350" height="225" rx="24" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><rect x="40" y="374" width="350" height="7" rx="3" fill="#2C58B5" stroke="none" stroke-width="0"></rect><text x="66" y="410" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.4" text-anchor="start">КЛИЕНТСКИЙ КОНТУР</text><text x="66" y="451" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">client-service</text><text x="66" y="483" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Профиль, заявки, документы</text><text x="66" y="507" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">и публичная проекция</text><rect x="66" y="533" width="296" height="43" rx="12" fill="#E8EEFA" stroke="none" stroke-width="0"></rect><ellipse cx="94" cy="548" rx="10" ry="4" fill="none" stroke="#2C58B5" stroke-width="1.4"></ellipse><path d="M84,548 v12 c0,5 20,5 20,0 v-12" fill="none" stroke="#2C58B5" stroke-width="1.4"></path><text x="117" y="560" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">client_db</text><text x="270" y="560" fill="#2C58B5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">PostgreSQL</text><rect x="465" y="374" width="350" height="225" rx="24" fill="#202C42" stroke="none" stroke-width="0" filter="url(#card-shadow)"></rect><rect x="465" y="374" width="350" height="7" rx="3" fill="#EF3124" stroke="none" stroke-width="0"></rect><text x="491" y="410" fill="#BFC9DB" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.4" text-anchor="start">АСИНХРОННАЯ ГРАНИЦА</text><text x="491" y="451" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="start">Kafka</text><text x="491" y="483" fill="#D5DEED" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">События и публичные снимки</text><text x="491" y="507" fill="#D5DEED" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">без общей БД</text><rect x="491" y="527" width="298" height="54" rx="12" fill="#34435D" stroke="none" stroke-width="0"></rect><circle cx="512" cy="545" r="5" fill="#EF3124"></circle><text x="528" y="550" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start">client.events  →  банк</text><circle cx="512" cy="566" r="5" fill="#8AA9FF"></circle><text x="528" y="571" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start">bank.events  →  клиент</text><rect x="890" y="374" width="350" height="225" rx="24" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.3" filter="url(#card-shadow)"></rect><rect x="890" y="374" width="350" height="7" rx="3" fill="#0F7451" stroke="none" stroke-width="0"></rect><text x="916" y="410" fill="#0F7451" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.4" text-anchor="start">БАНКОВСКИЙ КОНТУР</text><text x="916" y="451" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">bank-service</text><text x="916" y="483" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Дело, правила, оферта</text><text x="916" y="507" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">и аудит решения</text><rect x="916" y="533" width="296" height="43" rx="12" fill="#E4F3EC" stroke="none" stroke-width="0"></rect><ellipse cx="944" cy="548" rx="10" ry="4" fill="none" stroke="#0F7451" stroke-width="1.4"></ellipse><path d="M934,548 v12 c0,5 20,5 20,0 v-12" fill="none" stroke="#0F7451" stroke-width="1.4"></path><text x="967" y="560" fill="#0F7451" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">bank_db</text><text x="1120" y="560" fill="#0F7451" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">PostgreSQL</text><line x1="399" y1="448" x2="454" y2="448" stroke="#EF3124" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"></line><line x1="455" y1="528" x2="400" y2="528" stroke="#2C58B5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="825" y1="448" x2="880" y2="448" stroke="#EF3124" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"></line><line x1="880" y1="528" x2="825" y2="528" stroke="#2C58B5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"></line><line x1="1065" y1="606" x2="1065" y2="636" stroke="#0F7451" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-gray)"></line><rect x="40" y="649" width="1200" height="161" rx="22" fill="#E4F3EC" stroke="none" stroke-width="0"></rect><text x="66" y="682" fill="#0F7451" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.6" text-anchor="start">ЛОКАЛЬНЫЕ ЗАВИСИМОСТИ БАНКА  ·  gRPC</text><rect x="66" y="702" width="352" height="81" rx="16" fill="#FFFFFF" stroke="#C9E5D8" stroke-width="1.3"></rect><rect x="84" y="721" width="6" height="42" rx="3" fill="#0F7451" stroke="none" stroke-width="0"></rect><text x="106" y="735" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="start">bureau-mocks</text><text x="106" y="758" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Синтетические проверки</text><rect x="464" y="702" width="352" height="81" rx="16" fill="#FFFFFF" stroke="#C9E5D8" stroke-width="1.3"></rect><rect x="482" y="721" width="6" height="42" rx="3" fill="#0F7451" stroke="none" stroke-width="0"></rect><text x="504" y="735" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="start">scoring</text><text x="504" y="758" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Оценка риска</text><rect x="862" y="702" width="352" height="81" rx="16" fill="#FFFFFF" stroke="#C9E5D8" stroke-width="1.3"></rect><rect x="880" y="721" width="6" height="42" rx="3" fill="#0F7451" stroke="none" stroke-width="0"></rect><text x="902" y="735" fill="#1E2026" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="start">assistant</text><text x="902" y="758" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Тексты и резюме</text><text x="43" y="834" fill="#61666F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Техническое исключение: оригинал документа банк читает защищённым HTTP GET; состояние передаётся через Kafka.</text></svg>
