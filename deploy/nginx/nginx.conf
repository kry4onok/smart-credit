events {}

http {
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream auth_backend {
        zone auth_backend 64k;
        server auth:8080 resolve;
    }

    upstream client_backend {
        zone client_backend 64k;
        server client-service:8080 resolve;
    }

    server {
        listen 8080;

        client_max_body_size 20m;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = / {
            return 302 /docs/;
        }

        location = /docs {
            return 308 /docs/;
        }

        location /docs/ {
            proxy_pass http://swagger-ui:8080/;
        }

        location ~ ^/api/(auth|client|bank|common)\.yaml$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location /api/auth/ {
            proxy_pass http://auth_backend/auth/;
        }

        location /api/.well-known/ {
            proxy_pass http://auth_backend/.well-known/;
        }

        location /api/client/ {
            proxy_pass http://client_backend/client/;
        }

        location /api/backoffice/ {
            proxy_pass http://host.docker.internal:8080/backoffice/;
        }

        location /internal/auth/ {
            proxy_pass http://auth_backend/;
        }

        location /internal/client/ {
            proxy_pass http://client_backend/;
        }

        location /internal/bank/ {
            proxy_pass http://host.docker.internal:8080/;
        }

        location = /gateway/healthz {
            access_log off;
            return 204;
        }

        location / {
            return 404;
        }
    }
}
