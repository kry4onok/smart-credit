# Single entry point of the stack: static web app on /, services under /api.
# Upstreams are resolved at request time, so the web container starts even when
# a service is not running yet; such a route returns 502 until it is up.
events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        client_max_body_size 6m;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

        set $auth_upstream http://auth:8080;
        set $client_upstream http://client-service:8080;
        set $bank_upstream http://bank-service:8080;

        location /api/auth/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $auth_upstream;
        }

        location /api/.well-known/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $auth_upstream;
        }

        location /api/client/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $client_upstream;
        }

        location /api/backoffice/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $bank_upstream;
        }

        location /api/ {
            return 404;
        }

        location = /healthz {
            access_log off;
            return 204;
        }

        root /usr/share/nginx/html;

        # A location with its own add_header drops the server-level ones, so they are repeated here.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
            try_files $uri =404;
        }

        # Client-side routes (/cabinet/..., /bank/...) all render index.html.
        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
            try_files $uri /index.html;
        }
    }
}
