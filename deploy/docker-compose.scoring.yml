services:
  scoring:
    build:
      context: ..
      dockerfile: deploy/docker/scoring.Dockerfile
    ports:
      - "127.0.0.1:${SCORING_PORT:-50051}:50051"
    environment:
      SCORING_ADDR: "0.0.0.0:50051"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    restart: unless-stopped
