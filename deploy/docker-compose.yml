services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Copy .env.example to .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Copy .env.example to .env}
      CLIENT_DB_PASSWORD: ${CLIENT_DB_PASSWORD:?Copy .env.example to .env}
      BANK_DB_PASSWORD: ${BANK_DB_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.2
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  bank-service:
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/bank-service
    environment:
      BANK_HTTP_ADDR: ":8080"
      BANK_DATABASE_URL: postgres://bank_user:${BANK_DB_PASSWORD:?Copy .env.example to .env}@postgres:5432/bank_db?sslmode=disable
      BANK_HTTP_READ_HEADER_TIMEOUT: ${BANK_HTTP_READ_HEADER_TIMEOUT}
      BANK_HTTP_READ_TIMEOUT: ${BANK_HTTP_READ_TIMEOUT}
      BANK_HTTP_WRITE_TIMEOUT: ${BANK_HTTP_WRITE_TIMEOUT}
      BANK_HTTP_IDLE_TIMEOUT: ${BANK_HTTP_IDLE_TIMEOUT}
      BANK_HTTP_MAX_HEADER_BYTES: ${BANK_HTTP_MAX_HEADER_BYTES}
      BANK_DB_CONNECT_TIMEOUT: ${BANK_DB_CONNECT_TIMEOUT}
      BANK_DB_MAX_CONNS: ${BANK_DB_MAX_CONNS}
      BANK_DB_MIN_CONNS: ${BANK_DB_MIN_CONNS}
      BANK_DB_MAX_CONN_LIFETIME: ${BANK_DB_MAX_CONN_LIFETIME}
      BANK_DB_MAX_CONN_IDLE_TIME: ${BANK_DB_MAX_CONN_IDLE_TIME}
      BANK_DB_HEALTH_CHECK_PERIOD: ${BANK_DB_HEALTH_CHECK_PERIOD}
      BANK_READINESS_TIMEOUT: ${BANK_READINESS_TIMEOUT}
      BANK_SHUTDOWN_TIMEOUT: ${BANK_SHUTDOWN_TIMEOUT}
      BANK_DEMO_ANALYST_ID: ${BANK_DEMO_ANALYST_ID:-}
      BANK_ASSISTANT_GRPC_ADDR: assistant:50052
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  client-service:
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/client-service
    environment:
      CLIENT_HTTP_ADDR: ":8080"
      CLIENT_DATABASE_URL: postgres://client_user:${CLIENT_DB_PASSWORD}@postgres:5432/client_db?sslmode=disable
      CLIENT_HTTP_READ_HEADER_TIMEOUT: ${CLIENT_HTTP_READ_HEADER_TIMEOUT}
      CLIENT_HTTP_READ_TIMEOUT: ${CLIENT_HTTP_READ_TIMEOUT}
      CLIENT_HTTP_WRITE_TIMEOUT: ${CLIENT_HTTP_WRITE_TIMEOUT}
      CLIENT_HTTP_IDLE_TIMEOUT: ${CLIENT_HTTP_IDLE_TIMEOUT}
      CLIENT_HTTP_MAX_HEADER_BYTES: ${CLIENT_HTTP_MAX_HEADER_BYTES}
      CLIENT_DB_CONNECT_TIMEOUT: ${CLIENT_DB_CONNECT_TIMEOUT}
      CLIENT_DB_MAX_CONNS: ${CLIENT_DB_MAX_CONNS}
      CLIENT_DB_MIN_CONNS: ${CLIENT_DB_MIN_CONNS}
      CLIENT_DB_MAX_CONN_LIFETIME: ${CLIENT_DB_MAX_CONN_LIFETIME}
      CLIENT_DB_MAX_CONN_IDLE_TIME: ${CLIENT_DB_MAX_CONN_IDLE_TIME}
      CLIENT_DB_HEALTH_CHECK_PERIOD: ${CLIENT_DB_HEALTH_CHECK_PERIOD}
      CLIENT_READINESS_TIMEOUT: ${CLIENT_READINESS_TIMEOUT}
      CLIENT_SHUTDOWN_TIMEOUT: ${CLIENT_SHUTDOWN_TIMEOUT}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.33.1
    environment:
      URLS: >-
        [
          { "url": "/api/auth.yaml", "name": "Auth API" },
          { "url": "/api/client.yaml", "name": "Client API" },
          { "url": "/api/bank.yaml", "name": "Bank API" }
        ]
      URLS_PRIMARY_NAME: Bank API
      DEEP_LINKING: "true"
      DISPLAY_OPERATION_ID: "true"
      VALIDATOR_URL: none
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    volumes:
      - ../api:/usr/share/nginx/html/api:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    image: nginx:1.30.6-alpine
    depends_on:
      swagger-ui:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../api:/usr/share/nginx/html/api:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gateway/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  scoring:
    build:
      context: ..
      dockerfile: deploy/docker/scoring.Dockerfile
    ports:
      - "127.0.0.1:${SCORING_PORT:-50051}:50051"
    environment:
      SCORING_ADDR: "0.0.0.0:50051"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    restart: unless-stopped

  assistant:
    build:
      context: ..
      dockerfile: deploy/docker/assistant.Dockerfile
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:-50052}:50052"
    environment:
      ASSISTANT_ADDR: "0.0.0.0:50052"
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
