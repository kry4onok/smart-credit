name: Bank service CI

on:
  push:
    branches: [main, "feat/bank-*"]
    paths:
      - ".github/workflows/bank.yml"
      - ".env.example"
      - ".golangci.yml"
      - "Makefile"
      - "api/**"
      - "deploy/docker-compose.yml"
      - "deploy/docker/**"
      - "go.mod"
      - "go.sum"
      - "ml/scoring/**"
      - "pkg/api/**"
      - "proto/**"
      - "seed/**"
      - "services/bank-service/**"
      - "services/bureau-mocks/**"
  pull_request:
    paths:
      - ".github/workflows/bank.yml"
      - ".env.example"
      - ".golangci.yml"
      - "Makefile"
      - "api/**"
      - "deploy/docker-compose.yml"
      - "deploy/docker/**"
      - "go.mod"
      - "go.sum"
      - "ml/scoring/**"
      - "pkg/api/**"
      - "proto/**"
      - "seed/**"
      - "services/bank-service/**"
      - "services/bureau-mocks/**"

permissions:
  contents: read

jobs:
  bank-service:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Unit tests
        run: go test ./services/bank-service/... ./services/bureau-mocks/...
      - name: Go lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: ./services/bank-service/... ./services/bureau-mocks/...
      - name: Validate Compose configuration
        run: docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
      - name: Start Postgres and Kafka
        run: make infra-up
      - name: Start auth for Bank JWT integration
        run: make auth-up
      - name: Start scoring and bank with bureau mocks
        run: make scoring-up bank-up bank-demo-seed
      - name: Bank PostgreSQL integration tests
        run: make bank-outbox-test bank-decision-test bank-audit-test
      - name: Verify enrichment and automatic decision through bank API
        run: |
          python3 - <<'PY'
          import base64
          import json
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request

          config = dict(
              line.strip().split("=", 1)
              for line in open(".env", encoding="utf-8")
              if line.strip() and not line.lstrip().startswith("#") and "=" in line
          )
          with urllib.request.urlopen("http://127.0.0.1:8082/.well-known/jwks.json", timeout=5) as response:
              key_id = json.load(response)["keys"][0]["kid"]
          private_key = subprocess.check_output([
              "docker", "compose", "--env-file", ".env", "-f", "deploy/docker-compose.yml",
              "exec", "-T", "auth", "cat", "/var/lib/smart-credit/auth/private.pem",
          ])

          def encode(value):
              return base64.urlsafe_b64encode(
                  json.dumps(value, separators=(",", ":")).encode()
              ).rstrip(b"=")

          now = int(time.time())
          unsigned = b".".join((
              encode({"alg": "RS256", "typ": "JWT", "kid": key_id}),
              encode({
                  "sub": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",
                  "role": "ANALYST", "can_submit": False,
                  "iss": config["AUTH_JWT_ISSUER"], "aud": config["AUTH_JWT_AUDIENCE"],
                  "iat": now, "exp": now + 300,
              }),
          ))
          with tempfile.NamedTemporaryFile() as key_file:
              key_file.write(private_key)
              key_file.flush()
              signature = subprocess.run(
                  ["openssl", "dgst", "-sha256", "-sign", key_file.name],
                  input=unsigned, capture_output=True, check=True,
              ).stdout
          token = b".".join((unsigned, base64.urlsafe_b64encode(signature).rstrip(b"="))).decode()

          cases = {
              6: ("OFFER", None, True, True),
              7: ("MANUAL_REVIEW", "BUREAU_TIMEOUT", False, False),
          }
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              pending = []
              for number, (status, bureau_error, has_score, has_offer) in cases.items():
                  case_id = f"10000000-0000-4000-8000-{number:012d}"
                  url = f"http://127.0.0.1:8080/backoffice/applications/{case_id}"
                  try:
                      request = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                      with urllib.request.urlopen(request, timeout=5) as response:
                          case = json.load(response)
                  except (OSError, urllib.error.URLError, ValueError) as error:
                      pending.append(f"{case_id}: {error}")
                      continue
                  checks = case.get("checks") or {}
                  actual = (case.get("status"), checks.get("bureau_error"), bool(case.get("score")), bool(case.get("offer")))
                  expected = (status, bureau_error, has_score, has_offer)
                  if actual != expected:
                      pending.append(f"{case_id}: got {actual}, want {expected}")
              if not pending:
                  print("Bank integration passed: automatic offer and bureau timeout cases")
                  break
              time.sleep(2)
          else:
              raise SystemExit("Bank integration failed: " + "; ".join(pending))
          PY
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color --tail=200 postgres kafka auth scoring bureau-mocks bank-service
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down --volumes --remove-orphans
