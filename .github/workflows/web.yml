name: Web

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/web.yml"
      - "api/**"
      - "web/**"
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - "api/**"
      - "web/**"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same Node as deploy/docker/web.Dockerfile.
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generated API types match the OpenAPI specs
        run: |
          npm run gen
          git diff --exit-code -- src/api/generated
          test -z "$(git status --porcelain -- src/api/generated)"
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
